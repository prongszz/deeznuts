<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AKSHARAA SCROLLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe6d2;--ink:#1b1612;--mut:#6d6254;--card:#fbf5e6;--ac:#c8321a;--ln:#d8cbb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110f;--ink:#f4ead8;--mut:#a89c88;--card:#221d19;--ln:#3a322b}}
:root[data-theme="dark"]{--bg:#14110f;--ink:#f4ead8;--mut:#a89c88;--card:#221d19;--ln:#3a322b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'Noto Sans Devanagari',system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px;width:100%;box-sizing:border-box}
.pr{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.gh{background:none;border:1px solid var(--ln);border-radius:10px;padding:9px 14px}
.mut{color:var(--mut);font-size:13px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
#shell{display:none;flex:1;min-height:0;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--ln)}
.logo{font:700 17px/1 Fraunces,Georgia,serif;letter-spacing:.05em}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none}.view.on{display:block}
#feed{scroll-snap-type:y mandatory}
.pg{padding:14px}
nav{display:flex;border-top:1px solid var(--ln)}
nav button{flex:1;background:none;border:0;padding:12px 0;color:var(--mut)}nav button.on{color:var(--ac);font-weight:700}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:14px 64px 16px 16px;box-sizing:border-box}
.reel>*{position:relative;z-index:1}
.Society{background:linear-gradient(160deg,#7a1f12,#2a0d09)}.Civics{background:linear-gradient(160deg,#1f2a6b,#0b1030)}.Geography{background:linear-gradient(160deg,#1e5b3a,#082116)}.Service{background:linear-gradient(160deg,#8a1530,#33060f)}.Development{background:linear-gradient(160deg,#855205,#2b1a02)}.Culture{background:linear-gradient(160deg,#4a1d5e,#170720)}.Vid{background:#000}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.bars{display:flex;gap:4px}.bars b{flex:1;height:3px;background:#fff4;border-radius:2px}.bars b.f{background:#fff}
.pill{font-size:12px;background:#0006;padding:3px 10px;border-radius:99px;display:inline-block;margin-top:8px}
.sl{font:600 clamp(22px,6.2vw,30px)/1.32 Fraunces,Georgia,'Noto Sans Devanagari',serif;flex:1;display:flex;align-items:center;cursor:pointer}
.ti{font-weight:700;margin-bottom:3px}.cc{font-size:14px;opacity:.92}
.lg{margin-top:8px;display:flex;gap:6px}.lg button{background:#0005;border:1px solid #fff5;color:#fff;border-radius:99px;padding:3px 12px;font-size:12px}.lg button.on{background:#fff;color:#111}
.rail{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;z-index:2}
.rail button{width:44px;height:44px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:19px}.rail button.on{background:var(--ac)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);color:var(--ink);width:100%;max-width:480px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;box-sizing:border-box}
.sh.full{height:85%;padding:0;overflow:hidden}
.sh h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif}
#auth{padding:28px 20px}#auth h1{font:700 30px/1.1 Fraunces,Georgia,serif;margin:30px 0 6px}#auth input{margin:6px 0}
.row{display:flex;gap:8px;margin-top:8px}
.m{max-width:80%;padding:8px 11px;border-radius:14px;margin:5px 0;background:var(--card);border:1px solid var(--ln);word-wrap:break-word}.m.me{margin-left:auto;background:var(--ac);color:#fff;border-color:var(--ac)}
.rc{background:#0002;border-radius:8px;padding:7px 9px;margin-bottom:5px;cursor:pointer}
.peers{display:flex;gap:6px;overflow-x:auto;padding:10px 0}.pe{white-space:nowrap;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:5px 12px}.pe.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.av{width:64px;height:64px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 28px Fraunces,Georgia,serif}
.st{display:flex;gap:18px;margin:12px 0;text-align:center;font-size:12px;color:var(--mut)}.st b{display:block;font-size:18px;color:var(--ink)}
.b2{margin:6px 0;font-size:13px}.b2 i{display:block;height:6px;background:var(--ac);border-radius:3px;margin-top:2px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tl{position:relative;aspect-ratio:9/14;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}.tl video{width:100%;height:100%;object-fit:cover}.tl span{position:absolute;left:4px;right:4px;bottom:4px;color:#fff;font-size:11px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:99px;display:none;z-index:20;font-size:13px}
:root{--bg:#f3ead6;--card:#fffaf0;--ac:#c2371f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110f;--card:#221d19}}
:root[data-theme="dark"]{--bg:#14110f;--card:#221d19}
#auth{position:relative;min-height:100%;background:radial-gradient(120% 70% at 50% 0,#4a1409 0,#17100c 62%);color:#f4ead8;overflow:hidden;padding:40px 26px;box-sizing:border-box}
#auth::before{content:"अ";position:absolute;right:-30px;top:-50px;font:700 340px/1 'Noto Sans Devanagari',serif;color:#ffffff0d;pointer-events:none}
#auth>*{position:relative}#auth h1{font-size:38px;margin-top:80px;letter-spacing:.02em}#auth .mut{color:#cdbfa8}
#auth input{background:#ffffff12;border-color:#ffffff26;color:#fff;padding:13px;border-radius:12px}#auth input::placeholder{color:#b9ab94}#auth .gh{color:#f4ead8;border-color:#ffffff40}
.top{border:0;padding:12px 16px 6px}.logo{font-size:18px;letter-spacing:.14em}.tag-nep{font-size:12px;color:var(--ac);font-weight:600}
nav{margin:6px 12px 10px;border:1px solid var(--ln);border-radius:99px;background:var(--card);padding:4px;box-shadow:0 6px 20px #0002}
nav button{border-radius:99px;padding:9px 0;transition:.2s}nav button.on{background:var(--ac);color:#fff}
.pr{box-shadow:0 4px 14px #c2371f55}
#feed{inset:0 8px;border-radius:22px}.reel{border-radius:22px}
.reel::before{position:absolute;right:-20px;top:70px;font:700 290px/1 'Noto Sans Devanagari',serif;color:#ffffff10;z-index:0;pointer-events:none}
.Society::before{content:"स"}.Civics::before{content:"ध"}.Geography::before{content:"भू"}.Service::before{content:"सेवा";font-size:190px}.Development::before{content:"वि"}.Culture::before{content:"सं"}
.reel::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 8%,#ffffff18,transparent 50%);pointer-events:none}
.bars b{height:4px;border-radius:4px;transition:background .3s}
.pill{border:1px solid #f2c14e88;color:#f6d77a;background:#0004;backdrop-filter:blur(6px)}
.sl{font-size:clamp(24px,6.6vw,32px);padding-left:14px;border-left:3px solid #f2c14e;animation:rise .55s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ti{font:700 17px Fraunces,Georgia,'Noto Sans Devanagari',serif}
.rail button{background:#ffffff1f;backdrop-filter:blur(10px);border:1px solid #ffffff30;transition:transform .15s}.rail button:active{transform:scale(.88)}.rail button.on{background:var(--ac);border-color:transparent}
.av{width:76px;height:76px;background:linear-gradient(135deg,#c2371f,#e8a200);box-shadow:0 6px 18px #c2371f55}
.m{border-radius:18px 18px 18px 6px}.m.me{border-radius:18px 18px 6px 18px}
.sh{border-radius:22px 22px 0 0}.sh::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--ln);margin:-6px auto 12px}.sh.full::before{display:none}
</style></head><body>
<div id="app">
<div id="auth">
 <h1>AKSHARAA SCROLLS</h1><p class="mut">Doomscroll your Social Studies. Pick a username and password. No email needed.</p>
 <form id="af" onsubmit="return false"><input id="un" name="username" placeholder="Username (a–z, 0–9, _ .)" autocomplete="username" autocapitalize="off"><input id="pw" name="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
 <div class="row"><button class="pr" id="li">Log in</button><button class="gh" id="rg">Register</button></div><p id="ae" class="mut"></p></form>
</div>
<div id="shell">
 <div class="top"><span class="logo">AKSHARAA SCROLLS</span><span class="tag-nep">अक्षरा स्क्रोल्स</span></div>
 <main><div class="view on" id="feed"></div><div class="view" id="dm"></div>
 <div class="view" id="create"><div class="pg"><h3>Create a reel</h3><p class="mut">Upload a short video that teaches something. It appears on your profile and can show up in feeds and DMs on this device.</p>
 <input type="file" id="vf" accept="video/*"><input id="vc" placeholder="Caption" style="margin:8px 0"><button class="pr" id="vs">Post reel</button><p id="vm" class="mut"></p></div></div>
 <div class="view" id="prof"></div></main>
 <nav><button data-go="feed" class="on">Reels</button><button data-go="dm">Messages</button><button data-go="create">Create</button><button data-go="prof">Profile</button></nav>
</div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ---------- Content bank (facts taken from the Grade 9 Social Studies guide). Each slide: [English, Nepali] ----------
const T=[
{id:"soc",tag:"Society",ti:["Origin of Society","समाजको उत्पत्ति"],cap:["What really makes a society?","समाज वास्तवमा के हो?"],
 s:[["A society is a lasting network of people who depend on one another.","समाज भनेको एकअर्कामा निर्भर मानिसहरूको दिगो सम्बन्धको जाल हो।"],["A crowd disperses. A society continues across generations.","भीड तितरबितर हुन्छ; समाज पुस्तौँपुस्ता चलिरहन्छ।"],["It is dynamic: technology, ideas and migration keep reshaping it.","समाज गतिशील छ: प्रविधि, विचार र बसाइँसराइले यसलाई बदलिरहन्छन्।"],["A community is bound by place or belonging; society is the wider web.","समुदाय स्थान वा अपनत्वले बाँधिन्छ; समाज फराकिलो सम्बन्धजाल हो।"]],
 m:"Society meets shared needs no individual can satisfy alone, through families, schools, occupations and public institutions. It shapes character by teaching language, values and responsibilities, while individuals reshape it through creativity, criticism and collective action. Neither is wholly independent of the other."},
{id:"con",tag:"Civics",ti:["Constitutional Development","संवैधानिक विकास"],cap:["Seven constitutions, one long journey","सात संविधान, एउटै लामो यात्रा"],
 s:[["Nepal has studied seven major constitutional documents.","नेपालमा सातवटा प्रमुख संवैधानिक दस्तावेज अध्ययन गरिन्छ।"],["2004 B.S.: the Nepal Government Constitutional Act, under Padma Shumsher.","वि.सं. २००४: पद्मशमशेरको पालामा नेपाल सरकार वैधानिक कानुन।"],["2007 Interim Act · 2015 Constitution · 2019 Panchayat Constitution · 2047 Constitution.","२००७ अन्तरिम ऐन · २०१५ संविधान · २०१९ पञ्चायती संविधान · २०४७ संविधान।"],["2063: Interim Constitution. 2072 Ashoj 3 (20 Sep 2015): the present Constitution.","२०६३: अन्तरिम संविधान। २०७२ असोज ३ (२०१५ सेप्टेम्बर २०): वर्तमान संविधान।"]],
 m:"Dates: 2004 Magh 13; 2007 Chaitra 29; 2015 Falgun 1; 2019 Poush 1; 2047 Kartik 23; 2063 Magh 1; 2072 Ashoj 3. The lesson of this history: constitutions need acceptance and implementation, not just announcement. Durability requires rights protection, fair representation, effective services and peaceful correction of weaknesses."},
{id:"rig",tag:"Civics",ti:["Fundamental Rights","मौलिक हक"],cap:["Rights the Constitution guards","संविधानले रक्षा गर्ने अधिकार"],
 s:[["Fundamental rights are basic rights the constitution protects specially.","मौलिक हक संविधानले विशेष संरक्षण गरेका आधारभूत अधिकार हुन्।"],["They sit in Part 3 of the Constitution: Articles 16–46.","ती संविधानको भाग ३ मा छन्: धारा १६–४६।"],["Constitutional remedy: seek protection when a right is violated.","संवैधानिक उपचार: हक हनन भए संरक्षण माग्न सकिन्छ।"],["The Supreme Court and High Courts hold power to grant remedies.","सर्वोच्च र उच्च अदालतलाई उपचार दिने अधिकार छ।"]],
 m:"Part 3 has 31 fundamental-right headings covering civil, political, social and economic rights. Article 46 is the right to constitutional remedies; Articles 133 and 144 give powers to the Supreme Court and High Courts; Article 48 covers citizen duties. Untouchability is prohibited, protecting equal dignity. Rights must be read with their constitutional conditions, so check the exact legal text."},
{id:"gov",tag:"Civics",ti:["Good Governance","सुशासन"],cap:["What makes a government good?","राम्रो शासन कस्तो हुन्छ?"],
 s:[["Good governance is fair, answerable and effective public management.","सुशासन भनेको निष्पक्ष, उत्तरदायी र प्रभावकारी सार्वजनिक व्यवस्थापन हो।"],["Rule of law: authority works within law, not personal preference.","कानुनी शासन: अधिकार कानुनभित्र चल्छ, व्यक्तिगत रुचिले होइन।"],["Openness lets people see and question decisions.","पारदर्शिताले जनतालाई निर्णय हेर्न र प्रश्न गर्न दिन्छ।"],["Accountability: officials must explain their actions.","उत्तरदायित्व: अधिकारीले आफ्ना कार्यको जवाफ दिनुपर्छ।"]],
 m:"Good governance is about how decisions are made and carried out, not whether a leader is popular. Its elements include rule of law, openness, participation, responsiveness, fair involvement, accountability and efficient use of resources."},
{id:"lat",tag:"Geography",ti:["Latitude and Longitude","अक्षांश र देशान्तर"],cap:["Earth’s invisible grid","पृथ्वीको अदृश्य ग्रिड"],
 s:[["Latitude: angle north or south of the Equator (0°).","अक्षांश: भूमध्यरेखा (०°) बाट उत्तर वा दक्षिणको कोण।"],["Longitude: angle east or west of the Prime Meridian, through Greenwich.","देशान्तर: ग्रिनिचबाट जाने प्रधान मेरिडियनको पूर्व वा पश्चिमको कोण।"],["Earth turns 360° in 24 hours: 15° per hour, 4 minutes per degree.","पृथ्वी २४ घण्टामा ३६०° घुम्छ: प्रतिघण्टा १५°, प्रतिडिग्री ४ मिनेट।"],["Greenwich became the world’s initial meridian in 1884.","सन् १८८४ मा ग्रिनिच विश्वको प्रारम्भिक मेरिडियन बन्यो।"]],
 m:"The poles are 90° N and S; the Tropics are about 23.5° N and S; the polar circles about 66.5° N and S. The International Date Line follows roughly 180° but bends around some countries. Earth rotates west to east, so places farther east see sunrise and noon earlier."},
{id:"lan",tag:"Geography",ti:["Nepal’s Landforms","नेपालको भू-बनोट"],cap:["Plains to peaks in a few hours","केही घण्टामै मैदानदेखि हिमालसम्म"],
 s:[["Nepal climbs from plains to peaks within a short distance.","नेपालमा छोटो दूरीमै तराईदेखि हिमालसम्म उचाइ फेरिन्छ।"],["Three regions: Terai, Hill and Himalayan.","तीन क्षेत्र: तराई, पहाड र हिमाल।"],["About 885 km east–west and 193 km north–south on average.","पूर्व-पश्चिम करिब ८८५ किमी, उत्तर-दक्षिण औसत १९३ किमी।"],["7 provinces, 77 districts; 147,516 km² on the revised map.","७ प्रदेश, ७७ जिल्ला; संशोधित नक्सामा १,४७,५१६ वर्ग किमी।"]],
 m:"Nepal lies at roughly 26°22′–30°27′ N and 80°04′–88°12′ E. The landforms arose as the Indian plate pushed into the Eurasian plate, folding and lifting old Tethys Sea sediments. The Chure (Siwalik) hills lie north of the Terai, with Inner Terai valleys and the Mahabharat Range beyond. Older textbooks give 147,181 km², so say which version you use."},
{id:"cli",tag:"Geography",ti:["Nepal’s Climate","नेपालको हावापानी"],cap:["Why Manang stays dry","मनाङ किन सुक्खा रहन्छ?"],
 s:[["Weather is today’s atmosphere; climate is the long-run pattern.","मौसम आजको वायुमण्डल हो; हावापानी लामो समयको ढाँचा हो।"],["Higher places are colder; lower places are warmer.","उचाइ बढ्दै जाँदा चिसो, होचो ठाउँ तातो।"],["Roughly 90% of rain falls in the June–September monsoon.","करिब ९०% वर्षा जुन–सेप्टेम्बरको मनसुनमा पर्छ।"],["Manang and Mustang stay dry because mountains block the moisture.","हिमालले चिस्यान रोक्ने भएकाले मनाङ र मुस्ताङ सुक्खा छन्।"]],
 m:"The monsoon brings moist air mainly from the Bay of Bengal, and rain generally decreases from east to west. Winter (December–February) is cool and dry, though western weather systems bring rain and mountain snow. Climate is normally studied over a 30-year reference period. The 90% figure is a textbook estimate that varies by place and how the season is defined."},
{id:"srv",tag:"Service",ti:["Scouts and the Red Cross","स्काउट र रेडक्रस"],cap:["Service before self","आफूभन्दा पहिले सेवा"],
 s:[["Scouting builds character, teamwork and service.","स्काउटिङले चरित्र, टोलीभावना र सेवा विकास गर्छ।"],["Red Cross principles: humanity, impartiality, neutrality, independence, voluntary service, unity, universality.","रेडक्रसका सिद्धान्त: मानवता, निष्पक्षता, तटस्थता, स्वतन्त्रता, स्वैच्छिक सेवा, एकता, विश्वव्यापकता।"],["Nepal Red Cross Society began on 4 September 1963 (2020 B.S.).","नेपाल रेडक्रस सोसाइटी सन् १९६३ सेप्टेम्बर ४ (वि.सं. २०२०) मा सुरु भयो।"],["Nepal Scouts: 18 June 1952.","नेपाल स्काउट: सन् १९५२ जुन १८।"]],
 m:"World Scouting began with Baden-Powell’s Brownsea camp in 1907, and Scouting for Boys appeared in 1908. The ICRC’s founding meeting was on 17 February 1863. Nepal Red Cross work includes disaster assistance, first-aid training and blood services."},
{id:"hyd",tag:"Development",ti:["Hydropower","जलविद्युत"],cap:["Nepal’s water-power story","नेपालको जलशक्तिको कथा"],
 s:[["Hydropower turns falling water into electricity.","जलविद्युतले खसिरहेको पानीलाई बिजुलीमा बदल्छ।"],["Pharping Hydropower Station opened on 22 May 1911 (1968 B.S.).","फर्पिङ जलविद्युत केन्द्र सन् १९११ मे २२ (वि.सं. १९६८) मा उद्घाटन भयो।"],["It began with 500 kW: two 250 kW units.","यो ५०० किलोवाट (२५०-२५० किलोवाटका दुई इकाइ) बाट सुरु भयो।"],["Textbooks cite 83,000 MW theoretical and about 42,000 MW feasible.","पाठ्यपुस्तकमा ८३,००० मेगावाट सैद्धान्तिक र करिब ४२,००० मेगावाट सम्भाव्य उल्लेख छ।"]],
 m:"Potential is not installed capacity: projects need finance, engineering, transmission, environmental review, community agreement and maintenance. Reliable clean power supports homes, schools, health services, industry and irrigation, and can reduce fuelwood use and protect forests."},
